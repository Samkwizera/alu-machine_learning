<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Automated data augmentation workflow</title>
  <desc id="desc">A diagram showing original images flowing through augmentation policies into a stronger model.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="70" y="84" width="1060" height="462" rx="24" fill="#ffffff" stroke="#d7dfec" stroke-width="3"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">Automated Data Augmentation</text>
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#516070">Create useful training variations without changing the real label</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="120" y="290" width="210" height="130" rx="16" fill="#e8f3ff" stroke="#5b9be8" stroke-width="3"/>
    <text x="225" y="345" fill="#173b68">Original</text>
    <text x="225" y="378" fill="#173b68">Images</text>
    <path d="M365 355h92" stroke="#6f7f95" stroke-width="8" stroke-linecap="round"/>
    <path d="M450 330l38 25-38 25z" fill="#6f7f95"/>
    <rect x="500" y="265" width="230" height="180" rx="16" fill="#fff3df" stroke="#f0a642" stroke-width="3"/>
    <text x="615" y="321" fill="#6d4210">Search</text>
    <text x="615" y="354" fill="#6d4210">Augmentation</text>
    <text x="615" y="387" fill="#6d4210">Policy</text>
    <path d="M765 355h92" stroke="#6f7f95" stroke-width="8" stroke-linecap="round"/>
    <path d="M850 330l38 25-38 25z" fill="#6f7f95"/>
    <rect x="910" y="290" width="170" height="130" rx="16" fill="#e9f8ef" stroke="#4eaf6c" stroke-width="3"/>
    <text x="995" y="345" fill="#1f6136">Stronger</text>
    <text x="995" y="378" fill="#1f6136">Model</text>
  </g>
  <g fill="#36445a" font-family="Arial, sans-serif" font-size="20">
    <text x="160" y="480">flip</text>
    <text x="275" y="480">crop</text>
    <text x="390" y="480">rotate</text>
    <text x="515" y="480">shear</text>
    <text x="640" y="480">brightness</text>
    <text x="810" y="480">hue</text>
    <text x="930" y="480">validate</text>
  </g>
</svg>
